<style>

body{
    margin:0;
    padding:0;
    overflow:hidden;
    font-family:Arial,sans-serif;
}

/* CONTAINER */
.chat-container{

    display:flex;
    flex-direction:column;

    width:100%;
    height:100vh;

    background:#fff;
}

/* HEADER */
.chat-header{

    background:#005b8f;
    color:#fff;

    padding:16px;

    font-size:20px;
    font-weight:bold;
}

/* MENSAGENS */
.chat-messages{

    flex:1;

    overflow-y:auto;

    padding:12px;

    background:#f5f5f5;
}

/* INPUT */
.chat-input{

    display:flex;

    gap:8px;

    padding:10px;

    border-top:1px solid #ddd;

    background:#fff;
}

.chat-input input{

    flex:1;

    padding:10px;

    border:1px solid #ccc;
    border-radius:8px;

    font-size:14px;
}

.chat-input button{

    padding:10px 16px;

    border:none;

    background:#005b8f;
    color:white;

    border-radius:8px;

    cursor:pointer;
}

/* USER */
.user-message{

    background:#dff5df;

    padding:10px;

    border-radius:10px;

    margin-bottom:10px;

    align-self:flex-end;
}

/* BOT */
.bot-message{

    background:#e7e7e7;

    padding:10px;

    border-radius:10px;

    margin-bottom:10px;
}

</style>
