<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Coja AI</title>

  <style>
    body{
      font-family: Arial, sans-serif;
      background:#f4f4f4;
      margin:0;
      padding:0;
    }

    .chat-container{
      width:90%;
      max-width:800px;
      margin:30px auto;
      background:white;
      border-radius:10px;
      overflow:hidden;
      box-shadow:0 0 10px rgba(0,0,0,0.1);
    }

    .header{
      background:#006699;
      color:white;
      padding:20px;
      font-size:24px;
      font-weight:bold;
    }

    .messages{
      height:500px;
      overflow-y:auto;
      padding:20px;
    }

    .message{
      margin-bottom:15px;
      padding:12px;
      border-radius:8px;
      max-width:80%;
    }

    .user{
      background:#d9fdd3;
      margin-left:auto;
    }

    .bot{
      background:#eeeeee;
    }

    .input-area{
      display:flex;
      border-top:1px solid #ddd;
    }

    input{
      flex:1;
      padding:15px;
      border:none;
      font-size:16px;
    }

    button{
      padding:15px 25px;
      border:none;
      background:#006699;
      color:white;
      cursor:pointer;
      font-size:16px;
    }

    button:hover{
      background:#004466;
    }
  </style>
</head>

<body>

<div class="chat-container">

  <div class="header">
    Coja AI
  </div>

  <div class="messages" id="messages"></div>

  <div class="input-area">
    <input type="text" id="input" placeholder="Escreva a sua mensagem...">
    <button onclick="sendMessage()">Enviar</button>
  </div>

</div>

<script>

async function sendMessage(){

  const input = document.getElementById("input");
  const text = input.value;

  if(!text) return;

  addMessage(text, "user");

  input.value = "";

  const response = await fetch("/chat", {
    method:"POST",
    headers:{
      "Content-Type":"application/json"
    },
    body: JSON.stringify({
      message:text
    })
  });

  const data = await response.json();

  addMessage(data.reply, "bot");
}

function addMessage(text, type){

  const messages = document.getElementById("messages");

  const div = document.createElement("div");

  div.className = `message ${type}`;

  div.innerText = text;

  messages.appendChild(div);

  messages.scrollTop = messages.scrollHeight;
}

</script>

</body>
</html>
