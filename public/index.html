```html
<!DOCTYPE html>
<html lang="pt">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UFCBA Assistente Virtual</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{

    width:100%;
    height:100%;

    overflow:hidden;

    font-family:'Inter',sans-serif;

    background:
    linear-gradient(
        180deg,
        #eef5ef 0%,
        #f8fbf8 100%
    );
}



/* =========================================
   APP
========================================= */

.chat-container{

    width:100%;
    height:100vh;

    display:flex;
    flex-direction:column;

    background:
    rgba(255,255,255,.72);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
}



/* =========================================
   HEADER
========================================= */

.header{

    height:78px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 24px;

    color:#fff;

    background:
    linear-gradient(
        135deg,
        #1f8f45,
        #59c36a
    );

    box-shadow:
    0 8px 30px rgba(31,143,69,.25);

    position:relative;

    z-index:10;
}

.header-left{

    display:flex;
    align-items:center;

    gap:14px;
}

.logo{

    width:46px;
    height:46px;

    border-radius:14px;

    background:
    rgba(255,255,255,.18);

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:24px;

    backdrop-filter:blur(10px);
}

.header h1{

    font-size:23px;
    font-weight:800;

    letter-spacing:-0.5px;
}

.header span{

    display:block;

    font-size:13px;

    opacity:.9;

    font-weight:500;

    margin-top:2px;
}



/* =========================================
   STATUS
========================================= */

.status{

    display:flex;
    align-items:center;

    gap:8px;

    font-size:14px;

    font-weight:600;
}

.status-dot{

    width:10px;
    height:10px;

    border-radius:50%;

    background:#9dffaf;

    box-shadow:
    0 0 10px #9dffaf;
}



/* =========================================
   MESSAGES
========================================= */

.messages{

    flex:1;

    overflow-y:auto;

    padding:26px 22px 40px;

    scroll-behavior:smooth;
}



/* scrollbar */

.messages::-webkit-scrollbar{
    width:8px;
}

.messages::-webkit-scrollbar-thumb{

    background:#d7e8d8;

    border-radius:20px;
}



/* =========================================
   BALÕES
========================================= */

.bot-message,
.user-message,
.typing{

    max-width:86%;

    padding:16px 18px;

    margin-bottom:16px;

    border-radius:22px;

    line-height:1.7;

    font-size:15px;

    animation:fadeUp .22s ease;
}



/* bot */

.bot-message{

    background:
    rgba(255,255,255,.88);

    border:
    1px solid rgba(255,255,255,.7);

    color:#2c2c2c;

    box-shadow:
    0 8px 20px rgba(0,0,0,.05);

    border-top-left-radius:8px;
}



/* user */

.user-message{

    margin-left:auto;

    background:
    linear-gradient(
        135deg,
        #1f8f45,
        #59c36a
    );

    color:#fff;

    box-shadow:
    0 10px 22px rgba(31,143,69,.18);

    border-bottom-right-radius:8px;
}



/* links */

.bot-message a{

    color:#1f8f45;

    font-weight:700;

    text-decoration:none;

    word-break:break-word;
}

.bot-message a:hover{

    text-decoration:underline;
}



/* =========================================
   TYPING
========================================= */

.typing{

    background:
    rgba(255,255,255,.9);

    color:#666;

    border-top-left-radius:8px;

    width:max-content;

    display:flex;
    align-items:center;

    gap:10px;
}

.typing-dots{

    display:flex;
    gap:5px;
}

.typing-dots span{

    width:8px;
    height:8px;

    border-radius:50%;

    background:#72bf7d;

    animation:bounce 1.2s infinite;
}

.typing-dots span:nth-child(2){
    animation-delay:.2s;
}

.typing-dots span:nth-child(3){
    animation-delay:.4s;
}



/* =========================================
   INPUT
========================================= */

.input-area{

    padding:18px;

    background:
    rgba(255,255,255,.88);

    backdrop-filter:blur(12px);

    border-top:
    1px solid rgba(0,0,0,.05);

    display:flex;

    gap:12px;
}

.input-wrapper{

    flex:1;

    position:relative;
}

.input-area input{

    width:100%;

    border:none;

    outline:none;

    padding:16px 18px;

    border-radius:18px;

    font-size:15px;

    background:#f5f7f5;

    transition:.2s;
}

.input-area input:focus{

    background:#fff;

    box-shadow:
    0 0 0 4px rgba(31,143,69,.12);
}



/* botão */

.input-area button{

    border:none;

    min-width:58px;

    border-radius:18px;

    background:
    linear-gradient(
        135deg,
        #1f8f45,
        #59c36a
    );

    color:#fff;

    font-weight:700;

    cursor:pointer;

    padding:0 20px;

    transition:.2s;

    box-shadow:
    0 10px 22px rgba(31,143,69,.18);
}

.input-area button:hover{

    transform:translateY(-2px);

    opacity:.96;
}



/* =========================================
   ANIMAÇÕES
========================================= */

@keyframes fadeUp{

    from{
        opacity:0;
        transform:translateY(8px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes bounce{

    0%,
    80%,
    100%{
        transform:scale(0.7);
        opacity:.5;
    }

    40%{
        transform:scale(1);
        opacity:1;
    }
}



/* =========================================
   MOBILE
========================================= */

@media(max-width:768px){

    .header{

        padding:0 16px;

        height:72px;
    }

    .header h1{

        font-size:20px;
    }

    .header span{

        font-size:12px;
    }

    .logo{

        width:42px;
        height:42px;
    }

    .messages{

        padding:18px 14px 30px;
    }

    .bot-message,
    .user-message,
    .typing{

        max-width:94%;

        font-size:14px;

        padding:14px 16px;
    }

    .input-area{

        padding:12px;
    }

    .input-area input{

        padding:14px 16px;
    }

    .input-area button{

        min-width:52px;
    }
}

</style>

</head>

<body>

<div class="chat-container">



    <!-- HEADER -->

    <div class="header">

        <div class="header-left">

            <div class="logo">
                🤖
            </div>

            <div>

                <h1>UFCBA Assistente Virtual</h1>

                <span>União das Freguesias de Coja e Barril de Alva</span>

            </div>

        </div>

        <div class="status">

            <div class="status-dot"></div>

            Online

        </div>

    </div>



    <!-- MENSAGENS -->

    <div class="messages" id="messages">

        <div class="bot-message">
            👋 Olá! Sou o assistente virtual da UFCBA.
            <br><br>
            Posso ajudar com:
            <br>
            • Contactos
            <br>
            • Serviços online
            <br>
            • Eventos e notícias
            <br>
            • Apoio ao cidadão
            <br>
            • Informações da freguesia
        </div>

    </div>



    <!-- INPUT -->

    <div class="input-area">

        <div class="input-wrapper">

            <input
                type="text"
                id="userInput"
                placeholder="Escreva a sua mensagem..."
            >

        </div>

        <button onclick="sendMessage()">
            ➜
        </button>

    </div>

</div>



<script>

function formatarLinks(texto){

    return texto.replace(
        /(https?:\/\/[^\s]+)/g,
        '<a href="$1" target="_blank">$1</a>'
    );
}



async function sendMessage(){

    const input =
    document.getElementById("userInput");

    const text =
    input.value.trim();

    if(!text) return;

    const messages =
    document.getElementById("messages");



    /* USER */

    const userDiv =
    document.createElement("div");

    userDiv.className =
    "user-message";

    userDiv.innerText =
    text;

    messages.appendChild(userDiv);

    input.value = "";

    messages.scrollTop =
    messages.scrollHeight;



    /* TYPING */

    const typingDiv =
    document.createElement("div");

    typingDiv.className =
    "typing";

    typingDiv.innerHTML = `
        <div class="typing-dots">
            <span></span>
            <span></span>
            <span></span>
        </div>
        UFCBA AI está a escrever...
    `;

    messages.appendChild(typingDiv);

    messages.scrollTop =
    messages.scrollHeight;



    try{

        const response =
        await fetch("/chat",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                message:text
            })
        });

        const data =
        await response.json();



        typingDiv.remove();



        const botDiv =
        document.createElement("div");

        botDiv.className =
        "bot-message";

        botDiv.innerHTML =
        formatarLinks(data.reply);

        messages.appendChild(botDiv);

    }

    catch(error){

        typingDiv.remove();

        const erroDiv =
        document.createElement("div");

        erroDiv.className =
        "bot-message";

        erroDiv.innerHTML =
        "⚠️ Erro ao contactar o servidor.";

        messages.appendChild(erroDiv);
    }



    messages.scrollTop =
    messages.scrollHeight;
}



/* ENTER */

document
.getElementById("userInput")
.addEventListener("keypress", function(e){

    if(e.key === "Enter"){

        sendMessage();
    }

});

</script>

</body>
</html>
```
