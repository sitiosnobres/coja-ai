<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Freguesia 24H</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{

    width:100%;
    height:100%;

    overflow:hidden;

    font-family:'Inter',sans-serif;

    background:#f5f7f5;
}



/* =========================================
   APP
========================================= */

.chat-container{

    width:100%;
    height:100%;

    display:flex;
    flex-direction:column;

    background:#f7faf7;
}



/* =========================================
   HEADER
========================================= */

.header{

    height:78px;

    background:
    linear-gradient(
        135deg,
        #1f8f45,
        #59c36a
    );

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 18px;

    color:#fff;

    box-shadow:
    0 8px 30px rgba(31,143,69,.18);
}

.header-left{

    display:flex;
    align-items:center;

    gap:12px;
}

.logo{

    width:48px;
    height:48px;

    border-radius:14px;

    background:
    rgba(255,255,255,.18);

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:24px;
}

.title h1{

    font-size:18px;
    font-weight:800;

    line-height:1.1;
}

.title span{

    font-size:12px;

    opacity:.92;
}

.status{

    display:flex;
    align-items:center;

    gap:8px;

    font-size:14px;

    font-weight:600;
}

.status-dot{

    width:10px;
    height:10px;

    border-radius:50%;

    background:#9fffab;

    box-shadow:
    0 0 10px #9fffab;
}



/* =========================================
   MESSAGES
========================================= */

.messages{

    flex:1;

    overflow-y:auto;

    padding:18px;

    background:#f5f7f5;
}



/* =========================================
   BUBBLES
========================================= */

.bot-message,
.user-message,
.typing{

    max-width:88%;

    padding:16px 18px;

    border-radius:22px;

    margin-bottom:16px;

    line-height:1.7;

    font-size:15px;

    animation:fadeUp .2s ease;
}



/* bot */

.bot-message{

    background:#fff;

    color:#333;

    border-top-left-radius:8px;

    box-shadow:
    0 6px 18px rgba(0,0,0,.05);
}



/* user */

.user-message{

    margin-left:auto;

    background:
    linear-gradient(
        135deg,
        #1f8f45,
        #59c36a
    );

    color:#fff;

    border-bottom-right-radius:8px;

    box-shadow:
    0 10px 22px rgba(31,143,69,.15);
}



/* links */

.bot-message a{

    color:#1f8f45;

    font-weight:700;

    text-decoration:none;
}



/* =========================================
   TYPING
========================================= */

.typing{

    width:max-content;

    background:#fff;

    color:#666;

    border-top-left-radius:8px;
}



/* =========================================
   INPUT
========================================= */

.input-area{

    padding:14px;

    background:#fff;

    border-top:
    1px solid rgba(0,0,0,.06);

    display:flex;

    align-items:center;

    gap:10px;
}

.input-area input{

    flex:1;

    height:52px;

    border:none;

    outline:none;

    border-radius:18px;

    background:#f3f5f3;

    padding:0 18px;

    font-size:15px;
}

.input-area input:focus{

    box-shadow:
    0 0 0 4px rgba(31,143,69,.12);
}

.input-area button{

    width:54px;
    height:54px;

    border:none;

    border-radius:18px;

    cursor:pointer;

    color:#fff;

    font-size:22px;

    background:
    linear-gradient(
        135deg,
        #1f8f45,
        #59c36a
    );

    box-shadow:
    0 10px 20px rgba(31,143,69,.18);

    transition:.2s;
}

.input-area button:hover{

    transform:translateY(-2px);
}



/* =========================================
   ANIMATION
========================================= */

@keyframes fadeUp{

    from{
        opacity:0;
        transform:translateY(8px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}



/* =========================================
   MOBILE
========================================= */

@media(max-width:768px){

    .header{

        height:72px;

        padding:0 14px;
    }

    .title h1{

        font-size:17px;
    }

    .messages{

        padding:14px;
    }

    .bot-message,
    .user-message{

        max-width:95%;

        font-size:14px;
    }

    .input-area{

        padding:10px;
    }

}

</style>

</head>

<body>

<div class="chat-container">



    <!-- HEADER -->

    <div class="header">

        <div class="header-left">

            <div class="logo">
                🤖
            </div>

            <div class="title">

                <h1>Freguesia 24H</h1>

                <span>Apoio digital UFCBA</span>

            </div>

        </div>

        <div class="status">

            <div class="status-dot"></div>

            Online

        </div>

    </div>



    <!-- MESSAGES -->

    <div class="messages" id="messages">

        <div class="bot-message">

            👋 Olá! Sou o assistente digital da UFCBA.

            <br><br>

            Posso ajudar com:

            <br>• Contactos
            <br>• Serviços online
            <br>• Eventos e notícias
            <br>• Apoio ao cidadão
            <br>• Informações da freguesia

        </div>

    </div>



    <!-- INPUT -->

    <div class="input-area">

        <input
            type="text"
            id="userInput"
            placeholder="Escreva a sua mensagem..."
        >

        <button onclick="sendMessage()">
            ➜
        </button>

    </div>

</div>



<script>

function formatarLinks(texto){

    return texto.replace(
        /(https?:\/\/[^\s]+)/g,
        '<a href="$1" target="_blank">$1</a>'
    );
}



async function sendMessage(){

    const input =
    document.getElementById("userInput");

    const text =
    input.value.trim();

    if(!text) return;



    const messages =
    document.getElementById("messages");



    /* USER */

    const userDiv =
    document.createElement("div");

    userDiv.className =
    "user-message";

    userDiv.innerText =
    text;

    messages.appendChild(userDiv);



    input.value = "";



    messages.scrollTop =
    messages.scrollHeight;



    /* typing */

    const typingDiv =
    document.createElement("div");

    typingDiv.className =
    "typing";

    typingDiv.innerText =
    "Freguesia 24H está a escrever...";

    messages.appendChild(typingDiv);



    messages.scrollTop =
    messages.scrollHeight;



    try{

        const response =
        await fetch("/chat",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                message:text
            })
        });



        const data =
        await response.json();



        typingDiv.remove();



        const botDiv =
        document.createElement("div");

        botDiv.className =
        "bot-message";

        botDiv.innerHTML =
        formatarLinks(data.reply);

        messages.appendChild(botDiv);

    }

    catch(error){

        typingDiv.remove();



        const erroDiv =
        document.createElement("div");

        erroDiv.className =
        "bot-message";

        erroDiv.innerHTML =
        "⚠️ Erro ao contactar o servidor.";

        messages.appendChild(erroDiv);
    }



    messages.scrollTop =
    messages.scrollHeight;
}



/* ENTER */

document
.getElementById("userInput")
.addEventListener("keypress", function(e){

    if(e.key === "Enter"){

        sendMessage();
    }

});

</script>

</body>
</html>
