<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UFCBA IA</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f4f4;
    height:100vh;
}

.chat-container{

    width:100%;
    height:100vh;

    display:flex;
    flex-direction:column;

    background:white;
}

.header{

    background:#005b8f;
    color:white;

    padding:18px;

    font-size:26px;
    font-weight:bold;
}

.messages{

    flex:1;

    overflow-y:auto;

    padding:15px;

    background:#f5f5f5;
}

.bot-message{

    background:#e7e7e7;

    padding:12px;

    border-radius:10px;

    margin-bottom:10px;

    max-width:85%;

    line-height:1.5;
}

.user-message{

    background:#d8f5d8;

    padding:12px;

    border-radius:10px;

    margin-bottom:10px;

    margin-left:auto;

    max-width:85%;

    line-height:1.5;
}

.bot-message a{

    color:#005b8f;

    text-decoration:none;

    font-weight:bold;

    word-break:break-word;
}

.bot-message a:hover{

    text-decoration:underline;
}

.input-area{

    display:flex;

    gap:10px;

    padding:12px;

    border-top:1px solid #ddd;

    background:white;
}

.input-area input{

    flex:1;

    padding:12px;

    border:1px solid #ccc;

    border-radius:8px;

    font-size:15px;
}

.input-area button{

    padding:12px 18px;

    border:none;

    background:#005b8f;

    color:white;

    border-radius:8px;

    cursor:pointer;

    transition:0.2s;
}

.input-area button:hover{

    opacity:0.9;
}

.typing{

    background:#e7e7e7;

    padding:12px;

    border-radius:10px;

    margin-bottom:10px;

    max-width:85%;

    color:#666;

    font-style:italic;

    animation:pulse 1s infinite;
}

@keyframes pulse{

    0%{
        opacity:0.4;
    }

    50%{
        opacity:1;
    }

    100%{
        opacity:0.4;
    }
}

</style>
</head>

<body>

<div class="chat-container">

    <div class="header">
        UFCBA Assistente virtual
    </div>

    <div class="messages" id="messages">
<div class="typing-fixed" id="typingFixed">
    UFCBA AI está a escrever...
</div>
        <div class="bot-message">
            Olá 👋 Em que posso ajudar?
        </div>

    </div>

    <div class="input-area">

        <input
            type="text"
            id="userInput"
            placeholder="Escreva a sua mensagem..."
        >

        <button onclick="sendMessage()">
            Enviar
        </button>

    </div>

</div>

<script>

function formatarLinks(texto){

    return texto.replace(

        /(https?:\/\/[^\s]+)/g,

        '<a href="$1" target="_blank">$1</a>'
    );
}

async function sendMessage(){

    const input = document.getElementById("userInput");

    const text = input.value.trim();

    if(!text) return;

    const messages = document.getElementById("messages");

    // MENSAGEM UTILIZADOR
    messages.innerHTML += `
        <div class="user-message">
            ${text}
        </div>
    `;

    input.value = "";

    messages.scrollTo({
        top: messages.scrollHeight,
        behavior: "smooth"
    });

    // TYPING
    const typing = document.getElementById("typingFixed");

typing.style.display = "block";

messages.scrollTop = messages.scrollHeight;

    try{

        // FETCH SERVIDOR
        const response = await fetch("/chat",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                message:text
            })
        });

        const data = await response.json();
        typing.style.display = "none";

        // REMOVE TYPING
        document.getElementById(typingId)?.remove();

        // FORMATA LINKS
        const respostaFormatada = formatarLinks(data.reply);

        // RESPOSTA BOT
        messages.innerHTML += `
            <div class="bot-message">
                ${respostaFormatada}
            </div>
        `;

    }catch(error){

        // REMOVE TYPING
        typing.style.display = "none";

        messages.innerHTML += `
            <div class="bot-message">
                Erro ao contactar o servidor.
            </div>
        `;
    }

    // SCROLL FINAL
    messages.scrollTo({
        top: messages.scrollHeight,
        behavior: "smooth"
    });
}

// ENTER PARA ENVIAR
document
.getElementById("userInput")
.addEventListener("keypress", function(e){

    if(e.key === "Enter"){

        sendMessage();
    }

});

</script>

</body>
</html>
